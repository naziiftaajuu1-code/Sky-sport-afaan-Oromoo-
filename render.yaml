services:
  - type: web
    name: sky-sport-telegram-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://t.me/sky_sport_afaan_oromoo_bot/sky_sporti
      - key: FEED_URL
        value: https://sky-sporti-afaan-oromoo.blogspot.com/feeds/posts/default?alt=rss&max-results=20
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: POLL_SECONDS
        value: "3600"
      - key: HTTP_TIMEOUT
        value: "20"
      - key: MAX_POSTS
        value: "20"
